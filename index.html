<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>YONC SHOP — Welcome</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #ffffff, #edf6ff);
            color: #10243e;
        }

        .welcome {
            width: 90%;
            max-width: 430px;
            padding: 45px 28px;
            text-align: center;
            background: white;
            border: 1px solid #dce9f5;
            border-radius: 28px;
            box-shadow: 0 25px 70px rgba(20, 72, 116, .18);
            animation: muncul .7s ease;
        }

        .icon {
            width: 75px;
            height: 75px;
            margin: 0 auto 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: #e6f2ff;
            font-size: 34px;
        }

        .small-title {
            color: #6e8baa;
            font-size: 11px;
            letter-spacing: 4px;
            margin-bottom: 8px;
        }

        h1 {
            color: #0d4f91;
            font-size: 42px;
            letter-spacing: 3px;
            margin-bottom: 18px;
        }

        h1 span {
            color: #5b8fc5;
        }

        .text {
            color: #637890;
            font-size: 17px;
            line-height: 1.7;
            margin-bottom: 30px;
        }

        .start-btn {
            display: inline-block;
            padding: 15px 28px;
            background: #0d63b7;
            color: white;
            text-decoration: none;
            border-radius: 30px;
            font-size: 15px;
            font-weight: bold;
            box-shadow: 0 10px 25px rgba(13, 99, 183, .25);
            transition: .25s;
        }

        .start-btn:hover {
            background: #084d8d;
            transform: translateY(-3px);
        }

        @keyframes muncul {
            from {
                opacity: 0;
                transform: translateY(30px) scale(.95);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
    </style>
</head>

<body>

    <div class="welcome">

        <div class="icon">
            🛒
        </div>

        <p class="small-title">
            WELCOME TO
        </p>

        <h1>
            YONC<span>SHOP</span>
        </h1>

        <p class="text">
            Welcome kak! 👋<br>
            Mau belanja apa hari ini?
        </p>

        <a href="shop.html" class="start-btn">
            Mulai Belanja →
        </a>

    </div>

</body>

</html>
